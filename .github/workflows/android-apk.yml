name: Android APK

# Publishes an installable Navic APK to GitHub Releases, the same way the
# desktop app publishes its installers (see release.yml). Tag with `android-v…`
# so phone builds do not collide with desktop releases:
#
#   git tag android-v1.0.0
#   git push origin android-v1.0.0
#
# The run also uploads the APK as a workflow artifact for manual downloads.

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Navic vendors media3 and subsonic-kotlin as submodules (.gitmodules).
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest already ships the Android SDK with licenses accepted.
      # android-actions/setup-android@v3 runs `sdkmanager tools`, which was
      # removed from the SDK repository and makes the job fail before building.

      - name: Build Navic (default debug)
        working-directory: Navic
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDefaultDebug --console=plain --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp Navic/app/build/outputs/apk/default/debug/SOPlayer.apk dist/SOPlayer.apk
          sha256sum dist/SOPlayer.apk > dist/SOPlayer.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SOPlayer-apk
          path: dist/*

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
