<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>Riff remote</title>
<style>
  :root { color-scheme: dark; --bg:#101014; --card:#191922; --line:#2a2a38; --fg:#e8e6f0; --muted:#9b97ab; --accent:#7c6cff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(120% 80% at 50% 0%, #1d1b35 0%, var(--bg) 55%);
    color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main { width: 100%; max-width: 420px; }
  .logo { font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); text-align: center; }
  h1 { font-size: 28px; margin: 8px 0 4px; text-align: center; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row span:first-child { color: var(--muted); }
  .ok { color: #4ade80; }
  .off { color: #f87171; }
  .note { margin-top: 18px; font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }
</style>
</head>
<body>
<main>
  <div class="logo">Riff</div>
  <h1>Remote control</h1>
  <p class="sub">This page will let you control the PC player from your phone.</p>
  <div class="card">
    <div class="row"><span>Server</span><strong>Riff</strong></div>
    <div class="row"><span>Status</span><strong id="status">checking…</strong></div>
    <div class="row"><span>Version</span><strong id="version">—</strong></div>
  </div>
  <p class="note">Setup is not finished yet — remote playback controls arrive in a later step of the build.</p>
</main>
<script>
  fetch('/mobile/api/status', { cache: 'no-store' })
    .then((r) => r.json())
    .then((data) => {
      const status = document.getElementById('status');
      status.textContent = data.running ? 'online' : 'offline';
      status.className = data.running ? 'ok' : 'off';
      document.getElementById('version').textContent = data.version || '—';
    })
    .catch(() => {
      const status = document.getElementById('status');
      status.textContent = 'unreachable';
      status.className = 'off';
    });
</script>
</body>
</html>
